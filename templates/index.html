<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>수성구청 경주 현장체험 보고서</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f1e9;color:#34312c;font-family:system-ui,sans-serif}main{max-width:850px;margin:auto;padding:28px 18px}h1{font-size:26px}section{background:white;border-radius:16px;padding:24px;margin:18px 0}h2{font-size:20px;margin-top:0}label{display:block;margin:16px 0 6px;font-weight:600}input,textarea{width:100%;border:1px solid #cfc5b7;border-radius:8px;padding:12px;font:inherit}textarea{min-height:85px;resize:vertical}small{display:block;text-align:right;color:#777;margin-top:4px}.hint{color:#6b6257;line-height:1.6}button{width:100%;background:#91663e;color:white;border:0;border-radius:10px;padding:16px;font-size:18px;cursor:pointer}img{max-width:100%;max-height:180px;display:block;margin-top:10px}.notice{background:#fff2d5;padding:16px;border-radius:10px}#error{color:#ad2525;white-space:pre-wrap}button:disabled{opacity:.6}</style></head><body><main><h1>경주 조별 현장체험 보고서</h1><p class="hint">내용과 활동 사진을 입력한 후 PDF 저장을 눌러주세요.</p><div id="kakao" class="notice" hidden>카카오톡에서 저장이 되지 않으면 주소를 복사해 Chrome 또는 Safari에서 열어주세요.</div><form id="form" action="/pdf" method="post" enctype="multipart/form-data"><section><h2>01 조 정보</h2><label for="team_number">조 번호</label><input id="team_number" name="team_number" type="number" min="1" max="99" required><label for="team_name">조 이름</label><input id="team_name" name="team_name" maxlength="16" required><label for="members">조원 이름</label><input id="members" name="members" maxlength="100" placeholder="김세연, 왕윤하, 김선우, …" required></section>
{% for i in range(3) %}<section><h2>02 방문지 {{ i+1 }}</h2><label for="place_{{i}}">방문지 이름</label><input id="place_{{i}}" name="place_{{i}}" maxlength="24" required>{% for j in range(2) %}<label for="insight_{{i}}_{{j}}">· 인사이트 {{j+1}}</label><textarea id="insight_{{i}}_{{j}}" name="insight_{{i}}_{{j}}" maxlength="90" required placeholder="방문하면서 느낀 점이나 적용할 아이디어를 작성해주세요."></textarea>{% endfor %}<label for="photo_{{i}}">활동 사진 {{i+1}} (선택)</label><input id="photo_{{i}}" name="photo_{{i}}" type="file" accept="image/jpeg,image/png,image/webp"><p class="hint">JPG·PNG·WebP 사진을 첨부하세요. 원본 비율을 유지해 배치합니다.</p><img id="preview_{{i}}" hidden alt="활동 사진 미리보기"></section>{% endfor %}
<section><h2>03 탐방 소감 한마디</h2><textarea aria-label="탐방 소감 한마디" name="reflection" maxlength="160" required></textarea></section><p id="error" role="alert"></p><button id="save" type="submit">PDF 저장</button></form></main><script>
if(/KAKAOTALK/i.test(navigator.userAgent))document.querySelector('#kakao').hidden=false;
document.querySelectorAll('[maxlength]').forEach(el=>{const note=document.createElement('small');el.after(note);const update=()=>note.textContent=`남은 글자 수: ${el.maxLength-Array.from(el.value).length} / ${el.maxLength}`;el.addEventListener('input',update);update()});
for(let i=0;i<3;i++)document.querySelector(`#photo_${i}`).addEventListener('change',e=>{const img=document.querySelector(`#preview_${i}`);if(img.dataset.url)URL.revokeObjectURL(img.dataset.url);const file=e.target.files[0];img.hidden=!file;if(file){img.dataset.url=URL.createObjectURL(file);img.src=img.dataset.url}});
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const btn=document.querySelector('#save'),error=document.querySelector('#error');btn.disabled=true;btn.textContent='PDF 만드는 중…';error.textContent='';try{const response=await fetch('/pdf',{method:'POST',body:new FormData(e.target)});if(!response.ok)throw Error(await response.text());const blob=await response.blob(),url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`현장체험_보고서_${Number(e.target.team_number.value)}조_${e.target.team_name.value.replace(/[\\/:*?"<>|]/g,'_')}.pdf`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(err){error.textContent=err.message}finally{btn.disabled=false;btn.textContent='PDF 저장'}});
</script></body></html>
